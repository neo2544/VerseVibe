<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerseVibe - 실시간 싱크 가사</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <h1>VerseVibe</h1>
            <p class="subtitle">실시간 싱크 가사</p>
        </header>

        <!-- 초기 화면 -->
        <div id="initial-screen" class="screen active">
            <div class="icon-container">
                <div class="music-icon">🎵</div>
            </div>
            <p class="instruction">음악을 들려주세요</p>
            <div class="whisper-toggle-container">
                <label class="toggle-switch">
                    <input type="checkbox" id="whisper-toggle">
                    <span class="toggle-slider"></span>
                </label>
                <div class="toggle-label">
                    <span class="toggle-title">Whisper 음성인식</span>
                    <span class="toggle-desc" id="whisper-toggle-desc">OFF - Shazam만 사용 (빠름)</span>
                </div>
            </div>
            <button id="start-btn" class="btn primary">🎤 인식 시작</button>
            <button id="history-btn" class="btn secondary" style="margin-top: 12px;">📋 인식 기록</button>
        </div>

        <!-- 인식 중 화면 -->
        <div id="listening-screen" class="screen">
            <div class="waveform-container">
                <canvas id="waveform" width="300" height="100"></canvas>
            </div>
            <p class="status" id="listening-status">듣는 중...</p>
            <p class="attempt-count" id="attempt-count"></p>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <!-- Whisper 상태 표시 -->
            <div id="whisper-info" class="whisper-info" style="display: none;">
                <div id="whisper-status" class="whisper-status"></div>
                <div id="whisper-transcription" class="whisper-transcription" style="display: none;">
                    <span class="whisper-label">인식된 텍스트</span>
                    <p id="whisper-text"></p>
                </div>
            </div>
            <div id="whisper-mode-badge" class="whisper-mode-badge" style="display: none;">
                <span class="badge-dot"></span> Whisper ON
            </div>
            <button id="cancel-btn" class="btn secondary">취소</button>
        </div>

        <!-- 가사 화면 -->
        <div id="lyrics-screen" class="screen">
            <div class="song-info">
                <button class="live-badge" id="pause-btn" title="인식 일시정지/재개">🔴 LIVE</button>
                <h2 id="song-title">-</h2>
                <p id="song-artist">-</p>
            </div>
            <div class="lyrics-scroll-wrapper">
                <div class="lyrics-container" id="lyrics-container">
                    <!-- 가사가 여기에 표시됩니다 -->
                </div>
                <button class="scroll-to-current-btn" id="scroll-to-current-btn">현재 가사로 ↓</button>
            </div>
            <!-- 곡 전환 감지 토스트 -->
            <div class="song-candidate-toast" id="song-candidate-toast">
                <span class="toast-text" id="toast-text"></span>
            </div>
            <div class="song-progress-bar" id="song-progress-bar">
                <div class="song-progress-fill" id="song-progress-fill"></div>
            </div>
            <div class="sync-indicator" id="sync-indicator"></div>
            <div class="lyrics-bottom-bar">
                <div class="sync-controls">
                    <button id="sync-minus-btn" class="sync-btn" title="싱크 -0.5초">-0.5s</button>
                    <button id="sync-plus-btn" class="sync-btn" title="싱크 +0.5초">+0.5s</button>
                </div>
                <div class="controls">
                    <button id="lock-btn" class="sync-btn" title="곡 고정">🔓</button>
                    <button id="stop-btn" class="btn secondary btn-sm">중지</button>
                    <button id="retry-btn" class="btn primary btn-sm">다른 곡</button>
                </div>
            </div>
        </div>

        <!-- 에러 화면 -->
        <div id="error-screen" class="screen">
            <div class="error-icon">😕</div>
            <p class="error-message" id="error-message">인식할 수 없습니다</p>
            <button id="retry-error-btn" class="btn primary">다시 시도</button>
        </div>

        <!-- 인식 기록 화면 -->
        <div id="history-screen" class="screen">
            <div class="history-header">
                <h2>인식 기록</h2>
                <button id="history-back-btn" class="btn secondary btn-sm">돌아가기</button>
            </div>
            <div class="history-list" id="history-list"></div>
            <p class="history-empty" id="history-empty" style="display: none;">아직 인식한 곡이 없습니다</p>
            <div class="history-footer">
                <button id="history-clear-btn" class="btn btn-danger btn-sm">기록 삭제</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
